<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>90-Tage-Reset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: schmale Spalte wie ein Notizbuch. Oben Countdown mit 88-Tage-Streifen, darunter vier Reiter. */
:root{
  --bg:#ECEEF2; --surface:#FFFFFF; --surface2:#F3F4F7; --ink:#12151C; --muted:#5B6372; --line:#D8DCE4;
  --accent:#E8420F; --accent-ink:#FFFFFF; --ok:#1A9460; --warn:#C98200; --bad:#CF3049;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F14; --surface:#161A22; --surface2:#1E232D; --ink:#EDEFF4; --muted:#99A1B1; --line:#2B313D;
    --accent:#FF6B3D; --accent-ink:#14100E; --ok:#3FD18A; --warn:#F2B33D; --bad:#FF6B80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F14; --surface:#161A22; --surface2:#1E232D; --ink:#EDEFF4; --muted:#99A1B1; --line:#2B313D;
  --accent:#FF6B3D; --accent-ink:#14100E; --ok:#3FD18A; --warn:#F2B33D; --bad:#FF6B80; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 56px}
.app{max-width:900px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Hero */
.hero{display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(34px,8vw,58px);font-weight:750;line-height:1;margin-top:6px}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count .big{font-family:var(--display);font-weight:750;font-size:clamp(40px,9vw,64px);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.count .of{color:var(--muted);font-size:14px}
.count .left{font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(14px,1fr));gap:4px}
.cell{aspect-ratio:1;border:0;border-radius:4px;background:var(--surface2);cursor:pointer;padding:0;outline-offset:1px;box-shadow:inset 0 0 0 1px var(--line)}
.cell.future{opacity:.45}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.sel{outline:2px solid var(--ink)}
.legendrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
#saveStatus{font-family:var(--mono);font-size:12px}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tab{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 6px;font-weight:500;color:var(--muted);cursor:pointer;min-width:0}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.view[hidden]{display:none}
.view{display:flex;flex-direction:column;gap:16px}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{font-size:19px;font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:13px;color:var(--muted)}
.fld small{font-size:12px;color:var(--muted);font-family:var(--mono)}
input[type=time],input[type=number],input[type=text],textarea{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.sleepline{font-family:var(--mono);font-size:13px;color:var(--muted)}
.sleepline b{color:var(--ink)}

/* Tiles */
.tiles{display:flex;flex-direction:column;gap:8px}
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:52px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);cursor:pointer}
.tile .box,.chk{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);position:relative}
.tile[aria-pressed="true"],.tile.auto[aria-pressed="true"]{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-color:var(--ok)}
.tile[aria-pressed="true"] .box,.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.tile[aria-pressed="true"] .box::after,.chk[aria-pressed="true"]::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.tile.auto{border-style:dashed;cursor:default}
.tile .lbl{flex:1;min-width:0}
.tile em{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chk{background:transparent;cursor:pointer;padding:0}

/* Daybar */
.daybar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.nav{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:18px;line-height:1}
.nav:disabled{opacity:.35;cursor:default}
.daytitle{flex:1;min-width:150px}
.daytitle h2{font-size:21px;font-weight:700}
.daytitle p{font-family:var(--mono);font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rt{fill:none;stroke:var(--line);stroke-width:7}
.ring .rv{fill:none;stroke:var(--ok);stroke-width:7;stroke-linecap:round;transition:stroke-dasharray .35s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700}
.sunday{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid var(--accent);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Phone meter */
.meter{position:relative;height:12px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:var(--ok);transition:width .3s}
.meter i.over{background:var(--accent)}
.meter b{position:absolute;top:0;bottom:0;left:66.667%;width:2px;background:var(--ink)}

/* To-dos, mood */
.todo{display:flex;gap:12px;align-items:center}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood button{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 0;cursor:pointer;font-family:var(--mono);font-weight:700}
.mood button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.moodlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* Week */
.weekbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.wd .n{font-size:12px;color:var(--muted)}
.wd .col{width:60%;max-width:26px;height:64px;background:var(--surface2);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.wd .col i{display:block;width:100%;background:var(--ok)}
.wd .p{font-family:var(--mono);font-size:11px}
.wd.na{opacity:.4;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}

/* Verlauf */
.hrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.6fr) 74px;gap:12px;align-items:center;font-size:14px}
.hbar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--ok)}
.hrow .v{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--muted)}
.chart{overflow-x:auto}
.chart svg{width:100%;min-width:480px;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--mono);font-size:10px}
.chart .bar{fill:var(--ok)}
.chart .bar.over{fill:var(--accent)}
.chart .ref{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12.5px;color:var(--muted);font-weight:500}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Plan */
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.tip{display:flex;flex-direction:column;gap:4px;padding-top:12px;border-top:1px solid var(--line)}
.tip:first-of-type{border-top:0;padding-top:0}
.tip h4{margin:0;font-family:var(--display);font-size:16px}
.zonerow{display:grid;grid-template-columns:minmax(0,1.6fr) 1fr 1fr;gap:8px;align-items:center}
@media (max-width:420px){.zonerow{grid-template-columns:1fr 1fr}.zonerow>.zl{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <header class="hero">
    <div class="hero-top">
      <div>
        <p class="eyebrow">05.10. bis 31.12.2026</p>
        <h1>90-Tage-Reset</h1>
      </div>
      <div class="count">
        <span class="mono" style="color:var(--muted);font-size:13px">Tag</span>
        <span class="big" id="hDay">–</span>
        <span class="of" id="hOf"></span>
        <span class="left" id="hLeft"></span>
      </div>
    </div>
    <div class="strip" id="strip" role="group" aria-label="Alle Tage, antippen zum Öffnen"></div>
    <div class="legendrow">
      <span>Ein Feld ist ein Tag. Je grüner, desto höher dein Score. Orange Rand = heute.</span>
      <span id="saveStatus"></span>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Bereiche">
    <button class="tab" role="tab" id="tab-today" data-tab="today" aria-selected="true">Heute</button>
    <button class="tab" role="tab" id="tab-week" data-tab="week" aria-selected="false">Woche</button>
    <button class="tab" role="tab" id="tab-hist" data-tab="hist" aria-selected="false">Verlauf</button>
    <button class="tab" role="tab" id="tab-plan" data-tab="plan" aria-selected="false">Plan</button>
  </nav>

  <main>
    <section class="view" id="v-today" aria-labelledby="tab-today"></section>
    <section class="view" id="v-week" aria-labelledby="tab-week" hidden></section>
    <section class="view" id="v-hist" aria-labelledby="tab-hist" hidden></section>
    <section class="view" id="v-plan" aria-labelledby="tab-plan" hidden></section>
  </main>
</div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- Zeit ---------- */
var START='2026-10-05', END='2026-12-31', DAY=86400000;
function pad(n){return String(n).padStart(2,'0')}
function parse(s){var p=s.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])}
function fmt(ms){var d=new Date(ms);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
var N=Math.round((parse(END)-parse(START))/DAY)+1;
function keyOf(i){return fmt(parse(START)+(i-1)*DAY)}
function idxOf(k){return Math.round((parse(k)-parse(START))/DAY)+1}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function clampKey(k){var i=idxOf(k);return i<1?START:i>N?END:k}
function weekOf(k){return Math.ceil(idxOf(k)/7)}
var NW=Math.ceil(N/7);
var fLong=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});
var fShort=new Intl.DateTimeFormat('de-DE',{weekday:'short',timeZone:'UTC'});
var fDM=new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',timeZone:'UTC'});
function num1(v){return v.toLocaleString('de-DE',{maximumFractionDigits:1})}
function pct(v){return Math.round(v*100)+' %'}
function plural(n,a,b){return n+' '+(n===1?a:b)}

/* ---------- Daten ---------- */
var HAB=[
 {id:'bedOk',l:'Pünktlich ins Bett',auto:1,g:'sleep'},
 {id:'wakeOk',l:'Pünktlich aufgestanden',auto:1,g:'sleep'},
 {id:'routine',l:'Morgenroutine durchgezogen',g:'sleep'},
 {id:'noPhoneWake',l:'Kein Handy in den ersten 30 Min nach dem Aufstehen',g:'phone'},
 {id:'noPhoneBed',l:'Kein Handy in den letzten 30 Min vor dem Schlafen',g:'phone'},
 {id:'zones',l:'Handyverbotszonen eingehalten',g:'phone'},
 {id:'limitOk',l:'Unter dem Handy-Limit',auto:1,g:'phone'},
 {id:'healthy',l:'Gesund gegessen, kein Slop',g:'body'},
 {id:'noGoon',l:'Kein Gooning',g:'body'},
 {id:'room',l:'Zimmer sauber',g:'body'},
 {id:'deep',l:'Deep-Work-Block (60 Min ohne Handy)',g:'body'},
 {id:'todosOk',l:'To-Dos für den Tag geplant',auto:1,g:'todo'}
];
var DEF_SET={bed:'23:00',wake:'07:00',tol:15,limit:120,zones:[
 {l:'Nach dem Aufstehen',a:'07:00',b:'07:30'},
 {l:'Vor dem Schlafen',a:'22:30',b:'23:00'},
 {l:'Lernblock, Handy in anderem Raum',a:'09:00',b:'12:00'}
]};
function normalize(d){
  d=d||{};
  var set=JSON.parse(JSON.stringify(DEF_SET));
  var s=d.settings||{};
  Object.keys(s).forEach(function(k){set[k]=s[k]});
  return {settings:set,days:d.days||{},weeks:d.weeks||{}};
}
var S=normalize(), sel=clampKey(todayISO()), curWeek=weekOf(sel), tab='today';

function D(k){
  if(!S.days[k]) S.days[k]={bed:'',wake:'',phone:'',h:{},t:['','',''],td:[false,false,false],more:'',mood:0,note:''};
  var d=S.days[k];
  if(!d.h) d.h={}; if(!d.t) d.t=['','','']; if(!d.td) d.td=[false,false,false];
  return d;
}
function mins(t){if(!t) return null;var p=t.split(':').map(Number);return p[0]*60+p[1]}
function late(a,t){return ((a-t+720+1440)%1440)-720}
function calc(k){
  var d=S.days[k]||{}, st=S.settings, h=d.h||{}, t=d.t||[], td=d.td||[];
  var b=mins(d.bed), w=mins(d.wake), tb=mins(st.bed), tw=mins(st.wake);
  var ph=(d.phone===''||d.phone==null)?null:Number(d.phone);
  var auto={
    bedOk:b!=null&&late(b,tb)<=st.tol,
    wakeOk:w!=null&&late(w,tw)<=st.tol,
    limitOk:ph!=null&&ph<=st.limit,
    todosOk:t.some(function(x){return String(x).trim()})
  };
  var flags={}, done=0;
  HAB.forEach(function(x){var v=x.auto?auto[x.id]:!!h[x.id];flags[x.id]=v;if(v)done++});
  var touched=!!(d.bed||d.wake||ph!=null||Object.keys(h).some(function(x){return h[x]})||t.some(function(x){return String(x).trim()})||td.some(Boolean)||(d.more&&d.more.trim())||d.mood||(d.note&&d.note.trim()));
  var sleep=(b!=null&&w!=null)?((w-b+1440)%1440)/60:null;
  var tt=t.filter(function(x){return String(x).trim()}).length;
  var tdone=t.reduce(function(a,x,i){return a+((String(x).trim()&&td[i])?1:0)},0);
  return {flags:flags,auto:auto,done:done,score:touched?done/HAB.length:null,sleep:sleep,phone:ph,tasks:tt,tasksDone:tdone};
}
function agg(from,to){
  var n=0,sc=0,sl=0,nsl=0,ph=0,nph=0,tk=0,tkd=0;
  for(var i=from;i<=to;i++){
    var c=calc(keyOf(i)); if(c.score==null) continue;
    n++; sc+=c.score; if(c.sleep!=null){sl+=c.sleep;nsl++} if(c.phone!=null){ph+=c.phone;nph++} tk+=c.tasks; tkd+=c.tasksDone;
  }
  return {n:n,score:n?sc/n:null,sleep:nsl?sl/nsl:null,phone:nph?ph/nph:null,tasks:tk?tkd/tk:null};
}
function streaks(){
  var ti=Math.min(idxOf(todayISO()),N), cur=0, best=0;
  for(var i=1;i<=ti;i++){
    var c=calc(keyOf(i));
    if(c.score==null && i===ti) continue;
    if(c.score!=null && c.score>=0.7){cur++;if(cur>best)best=cur}else cur=0;
  }
  return {cur:Math.max(0,idxOf(todayISO())<1?0:cur),best:best};
}

/* ---------- Speichern ---------- */
var db=null, uid=null, dirty=false, saving=false, timer=null, remote=false;
function status(t){var e=$('#saveStatus');if(e) e.textContent=t}
function touch(){dirty=true;status('Speichert …');clearTimeout(timer);timer=setTimeout(flush,700)}
async function flush(){
  if(saving||!dirty) return;
  saving=true; dirty=false;
  try{
    var body=JSON.parse(JSON.stringify(S));
    if(db&&uid){ await db.doc('data/users/'+uid+'/main').set(body); status('Gespeichert'); }
    else { try{localStorage.setItem('reset90',JSON.stringify(body));status('Nur auf diesem Gerät gespeichert')}catch(e){status('Speichern nicht möglich')} }
  }catch(e){ dirty=true; status('Speichern fehlgeschlagen, neuer Versuch …'); setTimeout(flush,4000); }
  saving=false;
  if(dirty&&!timer) flush();
}
function isEditing(){var a=document.activeElement;return !!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))}
async function initStore(){
  try{
    if(window.claude&&window.claude.use){
      var r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(r[0]&&r[1]){var id=await r[1].id();if(id){db=r[0];uid=id}}
    }
  }catch(e){}
  try{
    if(db){
      var ref=db.doc('data/users/'+uid+'/main');
      var snap=await ref.get();
      if(snap.exists) S=normalize(snap.data());
      status('Gespeichert');
      ref.onSnapshot(function(sn){
        if(!sn.exists||sn.metadata.hasPendingWrites||dirty||saving||isEditing()) return;
        var inc=normalize(sn.data());
        if(JSON.stringify(inc)===JSON.stringify(S)) return;
        S=inc; renderAll();
      },function(){});
    } else {
      var raw=null; try{raw=localStorage.getItem('reset90')}catch(e){}
      if(raw) S=normalize(JSON.parse(raw));
      status('Nur auf diesem Gerät gespeichert');
    }
  }catch(e){status('Laden nicht möglich')}
  renderAll();
}

/* ---------- Hero ---------- */
function heat(sc){return sc==null?'var(--surface2)':'color-mix(in srgb, var(--ok) '+Math.round(18+sc*82)+'%, var(--surface2))'}
function buildStrip(){
  var h='';
  for(var i=1;i<=N;i++){h+='<button class="cell" data-i="'+i+'" type="button"></button>'}
  $('#strip').innerHTML=h;
}
function paintHero(){
  var ti=idxOf(todayISO());
  $('#hDay').textContent=ti<1?'–':String(Math.min(ti,N));
  $('#hOf').textContent='von '+N;
  $('#hLeft').textContent=ti<1?'Start in '+plural(1-ti,'Tag','Tagen'):ti>N?'Geschafft':ti===N?'Letzter Tag':'noch '+plural(N-ti,'Tag','Tage');
  $$('.cell').forEach(function(c){
    var i=+c.dataset.i, k=keyOf(i), sc=calc(k).score;
    c.style.background=heat(sc);
    c.classList.toggle('today',i===ti);
    c.classList.toggle('sel',k===sel);
    c.classList.toggle('future',i>ti);
    c.setAttribute('aria-label',fLong.format(parse(k))+(sc==null?', nichts eingetragen':', Score '+pct(sc)));
    c.title=fLong.format(parse(k))+(sc==null?'':' · '+pct(sc));
  });
}

/* ---------- Heute ---------- */
function tileHTML(x){
  if(x.auto) return '<div class="tile auto" data-h="'+x.id+'" aria-pressed="false"><span class="box"></span><span class="lbl">'+esc(x.l)+'</span><em>auto</em></div>';
  return '<button class="tile" type="button" data-h="'+x.id+'" aria-pressed="false"><span class="box"></span><span class="lbl">'+esc(x.l)+'</span></button>';
}
function tiles(g){return '<div class="tiles">'+HAB.filter(function(x){return x.g===g}).map(tileHTML).join('')+'</div>'}
function renderToday(){
  var k=sel, i=idxOf(k), d=S.days[k]||{}, t=d.t||['','',''], st=S.settings;
  var isSun=new Date(parse(k)).getUTCDay()===0;
  var zones=st.zones.map(function(z){return esc(z.a)+'–'+esc(z.b)+' '+esc(z.l)}).join(' · ');
  var moodBtns=[1,2,3,4,5].map(function(m){return '<button type="button" data-mood="'+m+'" aria-pressed="false">'+m+'</button>'}).join('');
  $('#v-today').innerHTML=
  '<div class="daybar">'+
    '<button class="nav" type="button" data-nav="-1" aria-label="Vorheriger Tag"'+(i<=1?' disabled':'')+'>‹</button>'+
    '<div class="daytitle"><h2>'+esc(fLong.format(parse(k)))+'</h2><p>Tag '+i+' von '+N+(k===todayISO()?' · heute':'')+'</p></div>'+
    (k!==todayISO()&&idxOf(todayISO())>=1&&idxOf(todayISO())<=N?'<button class="btn" type="button" data-nav="today">Heute</button>':'')+
    '<button class="nav" type="button" data-nav="1" aria-label="Nächster Tag"'+(i>=N?' disabled':'')+'>›</button>'+
    '<div class="ring" aria-label="Tagesscore"><svg viewBox="0 0 72 72"><circle class="rt" cx="36" cy="36" r="30"/><circle class="rv" id="ringV" cx="36" cy="36" r="30" stroke-dasharray="0 188.5"/></svg><span class="mono" id="ringT">–</span></div>'+
  '</div>'+
  (isSun?'<div class="sunday"><span>Sonntag: Zeit fürs Wochen-Learning und für die Top 3 von Montag.</span><button class="btn primary" type="button" data-tab="week">Zum Wochen-Learning</button></div>':'')+
  '<div class="grid">'+
    '<article class="card"><h3>Schlaf und Morgen</h3>'+
      '<div class="row2">'+
        '<label class="fld"><span>Ins Bett (letzte Nacht)</span><input id="f-bed" type="time" data-f="bed" value="'+esc(d.bed||'')+'"><small>Ziel '+esc(st.bed)+'</small></label>'+
        '<label class="fld"><span>Aufgestanden (heute)</span><input id="f-wake" type="time" data-f="wake" value="'+esc(d.wake||'')+'"><small>Ziel '+esc(st.wake)+'</small></label>'+
      '</div>'+
      '<p class="sleepline" id="sleepLine"></p>'+tiles('sleep')+
    '</article>'+
    '<article class="card"><h3>Handy</h3>'+
      '<label class="fld"><span>Handyzeit heute in Minuten (aus der Bildschirmzeit)</span><input id="f-phone" type="number" inputmode="numeric" min="0" max="1440" data-f="phone" value="'+esc(d.phone==null?'':d.phone)+'"></label>'+
      '<div class="meter" aria-hidden="true"><i id="phoneBar"></i><b></b></div>'+
      '<p class="hint" id="phoneTxt"></p>'+
      tiles('phone')+
      '<p class="hint">Sperrzeiten: '+zones+'</p>'+
    '</article>'+
    '<article class="card"><h3>Körper, Kopf und Zimmer</h3>'+tiles('body')+'</article>'+
    '<article class="card"><h3>To-Dos</h3>'+
      [0,1,2].map(function(n){return '<div class="todo"><button class="chk" type="button" data-td="'+n+'" aria-pressed="false" aria-label="Top '+(n+1)+' erledigt"></button><input id="f-t'+n+'" type="text" data-f="t'+n+'" placeholder="'+(n===0?'Top 1: das Wichtigste':'Top '+(n+1))+'" value="'+esc(t[n]||'')+'"></div>'}).join('')+
      '<label class="fld"><span>Weitere To-Dos und Notizen</span><textarea id="f-more" data-f="more" placeholder="Alles, was sonst noch ansteht">'+esc(d.more||'')+'</textarea></label>'+
      tiles('todo')+
    '</article>'+
    '<article class="card"><h3>Tag abschließen</h3>'+
      '<div><div class="mood" role="group" aria-label="Stimmung">'+moodBtns+'</div><div class="moodlbl" style="margin-top:6px"><span>1 schlecht</span><span>5 stark</span></div></div>'+
      '<label class="fld"><span>Highlight oder Auslöser des Tages</span><textarea id="f-note" data-f="note" placeholder="Was lief gut? Was hat dich rausgebracht?">'+esc(d.note||'')+'</textarea></label>'+
    '</article>'+
  '</div>';
  paintToday();
}
function paintToday(){
  if(tab!=='today') return;
  var k=sel, d=S.days[k]||{}, c=calc(k), st=S.settings;
  $$('#v-today [data-h]').forEach(function(el){el.setAttribute('aria-pressed',c.flags[el.dataset.h]?'true':'false')});
  $$('#v-today [data-td]').forEach(function(el){el.setAttribute('aria-pressed',(d.td&&d.td[+el.dataset.td])?'true':'false')});
  $$('#v-today [data-mood]').forEach(function(el){el.setAttribute('aria-pressed',(d.mood===+el.dataset.mood)?'true':'false')});
  var C=188.5, sc=c.score;
  $('#ringV').setAttribute('stroke-dasharray',(sc==null?0:C*sc)+' '+C);
  $('#ringT').textContent=sc==null?'–':Math.round(sc*100)+'%';
  var sl=$('#sleepLine');
  if(c.sleep!=null) sl.innerHTML='<b>'+num1(c.sleep)+' h</b> Schlaf'+(c.sleep<7?' · unter 7 h':c.sleep>9.5?' · über 9,5 h':'');
  else sl.textContent='Trag beide Uhrzeiten ein, dann rechnet die Seite die Schlafdauer aus.';
  var bar=$('#phoneBar'), tx=$('#phoneTxt');
  if(c.phone==null){bar.style.width='0%';bar.classList.remove('over');tx.textContent='Limit: '+st.limit+' Minuten pro Tag';}
  else{
    bar.style.width=Math.min(100,c.phone/(st.limit*1.5)*100)+'%';
    bar.classList.toggle('over',c.phone>st.limit);
    var diff=st.limit-c.phone;
    tx.textContent=c.phone+' von '+st.limit+' Minuten · '+(diff>=0?diff+' Minuten Luft':(-diff)+' Minuten drüber');
  }
}

/* ---------- Woche ---------- */
function renderWeek(){
  var w=curWeek, from=(w-1)*7+1, to=Math.min(w*7,N), a=agg(from,to), wk=S.weeks[w]||{};
  var cols='';
  for(var i=from;i<from+7;i++){
    if(i>N){cols+='<div class="wd na"><span class="n">–</span><div class="col"></div><span class="p">–</span></div>';continue}
    var k=keyOf(i), sc=calc(k).score;
    cols+='<button type="button" class="wd" data-day="'+k+'" aria-label="'+esc(fLong.format(parse(k)))+'"><span class="n">'+esc(fShort.format(parse(k)))+'<br>'+esc(fDM.format(parse(k)))+'</span><div class="col"><i style="height:'+(sc==null?0:Math.max(4,sc*100))+'%"></i></div><span class="p">'+(sc==null?'–':Math.round(sc*100)+'%')+'</span></button>';
  }
  $('#v-week').innerHTML=
  '<div class="weekbar"><button class="nav" type="button" data-wnav="-1" aria-label="Vorherige Woche"'+(w<=1?' disabled':'')+'>‹</button>'+
    '<div class="daytitle"><h2>Woche '+w+' von '+NW+'</h2><p>'+esc(fDM.format(parse(keyOf(from))))+'. bis '+esc(fDM.format(parse(keyOf(to))))+'.</p></div>'+
    '<button class="nav" type="button" data-wnav="1" aria-label="Nächste Woche"'+(w>=NW?' disabled':'')+'>›</button></div>'+
  '<div class="weekdays">'+cols+'</div>'+
  '<div class="kpis">'+
    '<div class="kpi"><span>Ø Score</span><b>'+(a.score==null?'–':pct(a.score))+'</b></div>'+
    '<div class="kpi"><span>Ø Schlaf</span><b>'+(a.sleep==null?'–':num1(a.sleep)+' h')+'</b></div>'+
    '<div class="kpi"><span>Ø Handyzeit</span><b>'+(a.phone==null?'–':Math.round(a.phone)+' min')+'</b></div>'+
    '<div class="kpi"><span>Top-3 erledigt</span><b>'+(a.tasks==null?'–':pct(a.tasks))+'</b></div>'+
  '</div>'+
  '<article class="card"><h3>Wochen-Learning</h3>'+
    '<label class="fld"><span>Was habe ich diese Woche gelernt?</span><textarea id="w-learn" data-f="w-learn" placeholder="Zum Beispiel: Wenn das Handy im Flur liegt, schlafe ich schneller ein.">'+esc(wk.learn||'')+'</textarea></label>'+
    '<label class="fld"><span>Was lief gut?</span><textarea id="w-good" data-f="w-good">'+esc(wk.good||'')+'</textarea></label>'+
    '<label class="fld"><span>Was ändere ich nächste Woche?</span><textarea id="w-change" data-f="w-change">'+esc(wk.change||'')+'</textarea></label>'+
  '</article>';
}

/* ---------- Verlauf ---------- */
function barChart(vals,o){
  var W=640,H=214,L=44,R=8,T=16,B=28, iw=W-L-R, ih=H-T-B, n=vals.length, bw=iw/n;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label)+'">';
  [0,0.5,1].forEach(function(f){var y=T+ih*(1-f);s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+o.fmt(o.max*f)+'</text>'});
  vals.forEach(function(v,i){
    var x=L+i*bw+bw*0.16, w=bw*0.68;
    if(v!=null){var h=ih*Math.min(1,v/o.max), y=T+ih-h;
      s+='<rect class="bar'+(o.over&&o.over(v)?' over':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3"/>';
      s+='<text class="ax" x="'+(x+w/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle">'+o.fmt(v)+'</text>';}
    s+='<text class="ax" x="'+(x+w/2).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle">W'+(i+1)+'</text>';
  });
  if(o.ref!=null){var ry=T+ih*(1-Math.min(1,o.ref/o.max));s+='<line class="ref" x1="'+L+'" x2="'+(W-R)+'" y1="'+ry.toFixed(1)+'" y2="'+ry.toFixed(1)+'"/><text class="ax" x="'+(W-R)+'" y="'+(ry-4).toFixed(1)+'" text-anchor="end" style="fill:var(--ink)">'+esc(o.refLabel)+'</text>';}
  return s+'</svg>';
}
function renderHist(){
  var all=agg(1,N), st=streaks();
  var tracked=[];
  for(var i=1;i<=N;i++){var c=calc(keyOf(i));if(c.score!=null)tracked.push(c)}
  var rows=HAB.map(function(x){
    var cnt=tracked.filter(function(c){return c.flags[x.id]}).length, q=tracked.length?cnt/tracked.length:0;
    return '<div class="hrow"><span>'+esc(x.l)+'</span><div class="hbar"><i style="width:'+Math.round(q*100)+'%"></i></div><span class="v">'+cnt+'/'+tracked.length+' · '+Math.round(q*100)+'%</span></div>';
  }).join('');
  var wScore=[],wPhone=[],mx=0;
  for(var w=1;w<=NW;w++){var a=agg((w-1)*7+1,Math.min(w*7,N));wScore.push(a.score);wPhone.push(a.phone);if(a.phone!=null&&a.phone>mx)mx=a.phone}
  var lim=S.settings.limit, pmax=Math.max(30,Math.ceil(Math.max(lim*1.5,mx*1.1)/30)*30);
  var months=[['2026-10','Oktober'],['2026-11','November'],['2026-12','Dezember']].map(function(m){
    var from=null,to=null;
    for(var i=1;i<=N;i++){if(keyOf(i).slice(0,7)===m[0]){if(from==null)from=i;to=i}}
    var a=agg(from,to);
    return '<tr><td>'+m[1]+'</td><td class="num">'+a.n+' von '+(to-from+1)+'</td><td class="num">'+(a.score==null?'–':pct(a.score))+'</td><td class="num">'+(a.sleep==null?'–':num1(a.sleep)+' h')+'</td><td class="num">'+(a.phone==null?'–':Math.round(a.phone)+' min')+'</td></tr>';
  }).join('');
  $('#v-hist').innerHTML=
  '<div class="kpis">'+
    '<div class="kpi"><span>Tage erfasst</span><b>'+all.n+' / '+N+'</b></div>'+
    '<div class="kpi"><span>Ø Score</span><b>'+(all.score==null?'–':pct(all.score))+'</b></div>'+
    '<div class="kpi"><span>Ø Schlaf</span><b>'+(all.sleep==null?'–':num1(all.sleep)+' h')+'</b></div>'+
    '<div class="kpi"><span>Ø Handyzeit</span><b>'+(all.phone==null?'–':Math.round(all.phone)+' min')+'</b></div>'+
    '<div class="kpi"><span>Serie ab 70 %</span><b>'+st.cur+' Tage</b></div>'+
    '<div class="kpi"><span>Beste Serie</span><b>'+st.best+' Tage</b></div>'+
  '</div>'+
  '<article class="card"><h3>Score pro Woche</h3><div class="chart">'+barChart(wScore,{max:1,fmt:function(v){return Math.round(v*100)+'%'},label:'Durchschnittlicher Tagesscore pro Woche'})+'</div></article>'+
  '<article class="card"><h3>Handyzeit pro Woche</h3><p class="hint">Durchschnitt in Minuten pro Tag. Orange heißt: über deinem Limit.</p><div class="chart">'+barChart(wPhone,{max:pmax,fmt:function(v){return String(Math.round(v))},ref:lim,refLabel:'Limit '+lim,over:function(v){return v>lim},label:'Durchschnittliche Handyzeit pro Woche in Minuten'})+'</div></article>'+
  '<article class="card"><h3>Wie oft hast du was geschafft?</h3>'+rows+'</article>'+
  '<article class="card"><h3>Monate</h3><div class="tablewrap"><table><thead><tr><th>Monat</th><th>Erfasst</th><th>Ø Score</th><th>Ø Schlaf</th><th>Ø Handy</th></tr></thead><tbody>'+months+'</tbody></table></div></article>';
}

/* ---------- Plan ---------- */
function renderPlan(){
  var st=S.settings;
  var zones=st.zones.map(function(z,i){return '<div class="zonerow"><span class="zl">'+esc(z.l)+'</span><input id="z-a'+i+'" type="time" data-f="s-za'+i+'" value="'+esc(z.a)+'" aria-label="Von"><input id="z-b'+i+'" type="time" data-f="s-zb'+i+'" value="'+esc(z.b)+'" aria-label="Bis"></div>'}).join('');
  var tips=[
   ['Handy','Lass das Handy nachts außerhalb vom Bett laden und nimm einen normalen Wecker. Stell Graustufen und App-Limits für TikTok, Instagram und YouTube ein und nimm die Social-Apps vom Homescreen.'],
   ['Gooning','Richte einen Blocker ein (Cold Turkey, Freedom oder einen DNS-Filter), nimm das Handy nie mit ins Bett oder aufs Klo und sei abends nicht lange allein am Handy. Bei Drang: aufstehen, Raum wechseln, Liegestütze oder kurz raus. Ein Rückfall ist kein Weltuntergang. Am nächsten Tag normal weiter und den Auslöser in die Notiz schreiben.'],
   ['Essen','Regeln statt Willenskraft: kein Junk im Haus, sonntags 30 bis 60 Minuten Meal-Prep, zu jeder Mahlzeit Protein und Gemüse, keine Softdrinks. Maximal ein bis zwei bewusste Cheat-Meals pro Woche.'],
   ['Schlaf','Kein Koffein nach etwa 14 Uhr, abends das Zimmer abdunkeln, in den ersten 30 Minuten nach dem Aufstehen Tageslicht. Auch am Wochenende höchstens eine Stunde Abweichung bei den Zeiten.'],
   ['Deep Work','Täglich 60 Minuten ohne Handy für Studium, Business-Ideen oder Video-Skills. Dieser Block bringt dich langfristig am meisten voran.'],
   ['Zimmer','Jeden Abend 10 Minuten Reset (Kleidung, Schreibtisch, Müll), sonntags 20 Minuten gründlicher.'],
   ['Sonntagsritual','Wochen-Learning schreiben, Meal-Prep, Zimmer-Reset und die Top 3 für Montag festlegen.'],
   ['Maßstab','Ein guter Tag liegt um 70 %. 100 % brauchst du nicht. Wichtig ist, nie zweimal hintereinander komplett auszusetzen.']
  ].map(function(t){return '<div class="tip"><h4>'+t[0]+'</h4><p>'+t[1]+'</p></div>'}).join('');
  $('#v-plan').innerHTML=
  '<div class="grid">'+
  '<article class="card"><h3>Deine Ziele</h3>'+
    '<div class="row2">'+
      '<label class="fld"><span>Ins Bett um</span><input id="s-bed" type="time" data-f="s-bed" value="'+esc(st.bed)+'"></label>'+
      '<label class="fld"><span>Aufstehen um</span><input id="s-wake" type="time" data-f="s-wake" value="'+esc(st.wake)+'"></label>'+
      '<label class="fld"><span>Toleranz in Minuten</span><input id="s-tol" type="number" inputmode="numeric" min="0" max="120" data-f="s-tol" value="'+esc(st.tol)+'"></label>'+
      '<label class="fld"><span>Handy-Limit pro Tag (Minuten)</span><input id="s-limit" type="number" inputmode="numeric" min="10" max="1440" data-f="s-limit" value="'+esc(st.limit)+'"></label>'+
    '</div>'+
    '<p class="hint">Das sind Startwerte. Passe sie an dich an und senke das Handy-Limit Schritt für Schritt. Pünktlichkeit und Limit-Habit rechnen sich damit automatisch.</p>'+
  '</article>'+
  '<article class="card"><h3>Handyverbotszonen</h3>'+zones+'<p class="hint">Die Zeiten erscheinen als Erinnerung im Tab Heute.</p></article>'+
  '<article class="card"><h3>Morgenroutine</h3><ol class="steps">'+
    '<li>Beim ersten Wecker aufstehen. Das Handy lädt außerhalb vom Bett.</li>'+
    '<li>Bett machen und ein großes Glas Wasser trinken.</li>'+
    '<li>Fenster auf oder 5 Minuten raus ans Tageslicht.</li>'+
    '<li>5 bis 10 Minuten Bewegung oder Dehnen, danach duschen (am Ende gern kalt).</li>'+
    '<li>Frühstück mit Eiweiß, noch ohne Handy.</li>'+
    '<li>Top 3 des Tages anschauen. Erst dann das Handy in die Hand nehmen.</li>'+
  '</ol></article>'+
  '<article class="card"><h3>Was du dir zusätzlich einbauen solltest</h3>'+tips+'</article>'+
  '</div>';
}

/* ---------- Steuerung ---------- */
function renderAll(){
  paintHero();
  if(tab==='today') renderToday(); else if(tab==='week') renderWeek(); else if(tab==='hist') renderHist(); else renderPlan();
}
function setTab(t){
  tab=t;
  $$('.tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===t?'true':'false')});
  ['today','week','hist','plan'].forEach(function(n){$('#v-'+n).hidden=(n!==t)});
  if(t==='week') curWeek=weekOf(sel);
  renderAll();
}
function go(k){sel=clampKey(k);if(tab==='today') renderToday();paintHero()}

$('#app').addEventListener('click',function(e){
  var el=e.target.closest('button,[data-h]'); if(!el) return;
  var ds=el.dataset;
  if(ds.tab){setTab(ds.tab);window.scrollTo({top:0});return}
  if(ds.i){sel=keyOf(+ds.i);setTab('today');window.scrollTo({top:0});return}
  if(ds.nav){
    if(ds.nav==='today') go(todayISO()); else go(keyOf(Math.min(N,Math.max(1,idxOf(sel)+(+ds.nav)))));
    return;
  }
  if(ds.wnav){curWeek=Math.min(NW,Math.max(1,curWeek+(+ds.wnav)));renderWeek();return}
  if(ds.day){sel=ds.day;setTab('today');window.scrollTo({top:0});return}
  if(ds.h){
    var hb=HAB.filter(function(x){return x.id===ds.h})[0];
    if(hb&&!hb.auto){var d=D(sel);d.h[ds.h]=!d.h[ds.h];touch();paintHero();paintToday()}
    return;
  }
  if(ds.td!=null){var d2=D(sel);var n=+ds.td;d2.td[n]=!d2.td[n];touch();paintHero();paintToday();return}
  if(ds.mood){var d3=D(sel);d3.mood=(d3.mood===+ds.mood)?0:+ds.mood;touch();paintHero();paintToday();return}
});
$('#app').addEventListener('input',function(e){
  var el=e.target, f=el.dataset&&el.dataset.f; if(!f) return;
  if(f==='bed'||f==='wake'||f==='more'||f==='note'){D(sel)[f]=el.value}
  else if(f==='phone'){D(sel).phone=el.value===''?'':Math.max(0,Math.min(1440,Math.round(Number(el.value))))}
  else if(/^t[0-2]$/.test(f)){D(sel).t[+f[1]]=el.value}
  else if(f.indexOf('w-')===0){if(!S.weeks[curWeek]) S.weeks[curWeek]={};S.weeks[curWeek][f.slice(2)]=el.value}
  else if(f.indexOf('s-')===0){
    var key=f.slice(2), st=S.settings;
    if(key==='bed'||key==='wake'){if(el.value) st[key]=el.value}
    else if(key==='tol'){var tv=Math.round(Number(el.value));if(!isNaN(tv)) st.tol=Math.max(0,Math.min(120,tv))}
    else if(key==='limit'){var lv=Math.round(Number(el.value));if(!isNaN(lv)&&lv>0) st.limit=Math.min(1440,lv)}
    else if(/^z[ab]\d$/.test(key)){var zi=+key[2];if(el.value&&st.zones[zi]) st.zones[zi][key[1]]=el.value}
  }
  touch(); paintHero(); paintToday();
});

buildStrip();
renderAll();
initStore();
})();
</script>
